name: Build and publish X-Music

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version as a customer update
        type: boolean
        default: false
      release_notes:
        description: Customer-facing plain-text release notes
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: xmusic-android-publication
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 scripts/xmusic_release.py prepare

      - name: Verify Android
        run: |
          python3 scripts/check_compose_resource_escapes.py
          python3 scripts/check_translation_mechanics.py
          ./gradlew :androidApp:assembleDebug :androidApp:lintDebug :androidApp:testDebugUnitTest :shared:testAndroidHostTest :androidApp:ktlintCheck :shared:ktlintCheck \
            --no-daemon --no-parallel --max-workers=2 --no-configuration-cache \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'

      - name: Restore production signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xmusic-production.p12"

      - name: Build signed production APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/xmusic-production.p12
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ./gradlew :androidApp:assembleRelease \
            --no-daemon --no-parallel --max-workers=2 --no-configuration-cache \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8'

      - name: Verify signed APK
        env:
          SIGNING_SHA256: ${{ vars.XMUSIC_SIGNING_SHA256 }}
        run: python3 scripts/xmusic_release.py verify

      - name: Upload signed APK and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: X-Music-production
          path: |
            dist/X-Music.apk
            dist/SHA256SUMS
            dist/build-info.json
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish customer update
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/xmusic_release.py publish

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/xmusic-production.p12"
